ugv_measurements:
  ros__parameters:
    use_sim_time: true
    gps_horizontal_stddev: 1.5
    gps_vertical_stddev: 3.0
    odom_xy_stddev_per_sqrt_meter: 0.05
    odom_yaw_stddev_per_sqrt_meter: 0.02
    odom_linear_velocity_stddev: 0.05
    odom_angular_velocity_stddev: 0.02
    imu_orientation_stddev: 0.02
    imu_angular_velocity_stddev: 0.01
    imu_linear_acceleration_stddev: 0.1
    random_seed: 513
